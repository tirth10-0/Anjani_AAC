<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjani Agri Care ERP - Redirecting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0a0f0d 0%, #050807 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 36px 28px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    p { font-size: 14px; color: rgba(255, 255, 255, 0.65); margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #0C3925;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #165b3d; }
  </style>
  <link rel="shortcut icon" href="./favicon.ico?v=1793358322300">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png?v=1793358322300">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png?v=1793358322300">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=1793358322300">
</head>
<body>
  <div class="card">
    <h1>Page Not Found</h1>
    <p>Redirecting you to the Anjani Agri Care ERP home page...</p>
    <a href="./index.html" class="btn" id="home-link">Go to Home</a>
  </div>
  <script>
    setTimeout(function() {
      // Intelligently redirect to index.html relative to current origin/repo base
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      if (pathSegments.length > 0) {
        // If deployed under github.io/<repo-name>/...
        var repoBase = '/' + pathSegments[0] + '/';
        window.location.replace(repoBase + 'index.html');
      } else {
        window.location.replace('./index.html');
      }
    }, 1500);
  </script>
</body>
</html>
