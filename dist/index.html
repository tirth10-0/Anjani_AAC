    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#0a0f0d 0%,#050807 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

  <script>
    (async function() {
      // Fix for GitHub Pages repo subpath resolution:
      // When opening https://user.github.io/repo without a trailing slash,
      // resolving './pages/dashboard.html' strips the repo name and produces
      // https://user.github.io/pages/dashboard.html (404 Error).
      const path = window.location.pathname;
      if (!path.endsWith('/') && !path.endsWith('.html')) {
        window.location.replace(window.location.origin + path + '/' + window.location.search + window.location.hash);
        return;
      }

      localStorage.removeItem('admin_logged_in');
      try {
        if (window.dbClient && window.dbClient.auth) {
          const { data: { session } } = await window.dbClient.auth.getSession();
          if (session) {
            window.location.replace('./pages/dashboard.html');
            return;
          }
        }
      } catch (e) {
        console.warn('Auth check error on landing:', e);
      }
      window.location.replace('./login.html');
    })();
  </script>
</body>
